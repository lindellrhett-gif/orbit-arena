name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Same (spec, seed) must give the same run in Chrome, Firefox and Safari's engine (WebKit).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers

  ios-app:
    # The iOS app (mobile/) is built and signed by EAS Build; this checks its JavaScript side and that the bundled
    # game is up to date with the web app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run build:native
      - name: Bundled game is up to date (run `npm run build:native` and commit if this fails)
        run: git diff --exit-code mobile/src/webApp.ts
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo export --platform ios --output-dir /tmp/expo-export
        working-directory: mobile
